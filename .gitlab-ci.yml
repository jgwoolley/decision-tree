stages:
  - test
  - deploy

default:
  image: node:20
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - .npm/
  before_script:
    - npm ci --cache .npm --prefer-offline

typecheck:
  stage: test
  script:
    - npm run typecheck

test:
  stage: test
  script:
    - npm test

# GitLab Pages requires a job literally named `pages` whose artifact is a
# directory named `public` (the older, most widely-compatible convention —
# works on GitLab.com and self-managed instances alike, not just 16.1+'s
# `pages.publish` keyword).
pages:
  stage: deploy
  needs:
    - typecheck
    - test
  script:
    - npm run build
    - rm -rf public
    - mv dist public
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
